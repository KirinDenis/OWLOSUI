# The DOS build: a custom target, and `core` and `alloc` built for it
# (no prebuilt ones exist), which needs nightly:
#
#     rustup toolchain install nightly --component rust-src
#     cd Examples/Rust/04-DOS && cargo +nightly build --release
#
# The output is a flat binary linked at address 0, which OWLOS.COM loads.
[build]
target = "i386-owlos-none.json"

[unstable]
json-target-spec = true
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

[target.i386-owlos-none]
rustflags = [
    "-C", "link-arg=-Tlink.ld",
    "-C", "link-arg=--oformat=binary",
    "-C", "link-arg=--gc-sections",
]
