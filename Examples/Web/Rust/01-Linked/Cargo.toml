[package]
name = "owlosui-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The core in a browser: a WebAssembly module with a small application inside, and the JavaScript that draws its cells on a canvas."

# A library the browser loads, not a program: `WebAssembly.instantiate`
# calls the exported functions and reads the frame out of its memory.
[lib]
crate-type = ["cdylib"]

[dependencies]
owlosui-core = { path = "../../../../lib/core" }
