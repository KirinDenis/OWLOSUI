# The live demo: on every push to main, the core is built for the browser
# and the site - Examples/Web/site/build.mjs - goes to GitHub Pages.
#
# Once, in the repository's Settings > Pages: Source "GitHub Actions".
name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: The core, for the browser
        run: |
          cargo build -p owlosui-wire --target wasm32-unknown-unknown --release
          cp target/wasm32-unknown-unknown/release/owlosui_wire.wasm lib/js/owlosui-wire.wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The site
        run: node Examples/Web/site/build.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
