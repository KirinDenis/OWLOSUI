keywords = match mod move mut pub ref return self static struct super trait type unsafe use where while
types = bool char f32 f64 i8 i16 i32 i64 i128 isize u8 u16 u32 u64 u128 usize str
types = Self String Vec Option Result Box Some None Ok Err true false

