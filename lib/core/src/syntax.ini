comment = //
block = /* */
string = " \
string = ' \
string = ` \ multiline
keywords = async await break case catch class const continue debugger default delete do else export
keywords = extends finally for from function get if import in instanceof let new of return set static
keywords = super switch this throw try typeof var void while with yield
types = true false null undefined NaN Infinity
types = Array Boolean Date Error JSON Map Math Number Object Promise RegExp Set String Symbol

[JSON]
files = JSON
string = " \
types = true false null

[Rust]
