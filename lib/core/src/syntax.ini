; Syntax colours: the languages the editor knows, one section each.
;
; The core carries this file inside itself, so it works on DOS with no file
; to find. A program adds languages of its own, or replaces one of these,
; by handing a text in the same format to add_syntax (SYNTAX_DEFINE on the
; wire): a section with the name of one here wins over it.
;
; Every line is   name = value . A list is separated by spaces, and a name
; may be given again to add to its list. Nothing may follow a value on its
; line - a ; there would be part of the value.
;
;   files            extensions that are this language: C H
;   case = ignore    keywords match in either case (Pascal, assembler)
;   word             characters that belong to a word besides letters,
;                    digits and _ : . @ ? for an assembler's labels
;   comment          markers of a comment that runs to the end of the line.
;                    A marker made of letters (rem) is matched as a word.
;   block            a comment with an end:  /* */   { }
;   block directive  the same, painted as a directive:  {$ }  (checked
;                    before the blocks, so {$I-} is not a comment)
;   directive        a line whose first word starts with this is a
;                    directive: # in C, [ for an INI section
;   string           a quote, then its escape character if it has one:  " \
;                    Add the word multiline for strings that may go on past
;                    the end of a line.
;   char             a quote for one character, as C's 'a' and '\n'. A lone
;                    one - Rust's 'a - is left alone.
;   number           characters that start a number besides a digit:  $ #
;   keywords         the language's own words, painted as keywords
;   types            types and constants: int, Boolean, true
;   directives       words painted as directives: an assembler's db, org
;
; Roles and their colours are in the palette - Syntax keyword, Syntax
; type and so on - and change with it.

[C]
files = C H
comment = //
block = /* */
directive = #
string = " \
char = ' \
keywords = auto break case const continue default do else enum extern for goto if inline register
keywords = restrict return sizeof static struct switch typedef union volatile while
keywords = far near huge interrupt cdecl pascal _asm __asm __far __near __interrupt
types = char double float int long short signed unsigned void
types = size_t FILE NULL EOF true false bool

[C#]
files = CS
comment = //
block = /* */
directive = #
string = " \
char = ' \
keywords = abstract as base break case catch checked class const continue default delegate do else
keywords = enum event explicit extern finally fixed for foreach goto if implicit in interface internal
keywords = is lock namespace new operator out override params private protected public readonly ref
keywords = return sealed sizeof stackalloc static struct switch this throw try typeof unchecked unsafe
keywords = using virtual volatile while async await get set init value var record when where yield
keywords = nameof with required global partial
types = bool byte char decimal double float int long object sbyte short string uint ulong ushort void
types = dynamic nint nuint true false null

[JavaScript]
