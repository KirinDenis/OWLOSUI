[package]
name = "owlosui-console"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal backend for OWLOSUI: VT output, raw input, CP437 translation, and the tools that check it against reference DOS screens."

[lib]
path = "src/lib.rs"

# `owlosui-match` renders one of the reference scenes and compares it with a
# dump of what the reference DOS program drew. It lives with the backend and not with the
# examples because it is part of how the library is checked, not part of how
# it is used.
[[bin]]
name = "owlosui-match"
path = "src/bin/match.rs"
required-features = ["term"]

# The terminal itself (raw mode, key decoding, mouse capture) is the one
# part that needs crossterm, and the one part a WebAssembly build of the
# wire server has no use for: it only wants the code pages. Off with
# `default-features = false`.
[features]
default = ["std", "term"]
# Without `std` the crate is the code pages alone, `no_std` plus `alloc`:
# what the DOS resident links (lib/dos). Everything else here reads files,
# the environment or the terminal.
std = ["owlosui-core/std"]
term = ["std", "dep:crossterm"]

[dependencies]
owlosui-core = { path = "../core", default-features = false }
# Only the platform layer is allowed dependencies, and only for the things
# that are genuinely the platform's: raw mode, key decoding, mouse capture.
# Drawing is ours — see term.rs.
crossterm = { version = "0.28", optional = true }
