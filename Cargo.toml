[workspace]
resolver = "2"
members = [
    "lib/core",
    "lib/console",
    "lib/serve",
    "Examples/Rust/01-Demo",
    "Examples/Rust/02-Window",
    "Examples/Rust/03-Browser",
]
# The DOS build is its own workspace: a different target, a nightly
# toolchain and build-std. `cd Examples/Rust/04-DOS && cargo +nightly build --release`.
exclude = ["Examples/Rust/04-DOS"]

# The browser module: small and honest. Profiles only count here, in the
# workspace root, so the wasm crate's wishes live here too. They apply to
# every release build, which is fine - nothing else minds.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
