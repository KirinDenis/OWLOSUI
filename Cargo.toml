[workspace]
resolver = "2"
members = [
    "lib/core",
    "lib/console",
    "lib/serve",
    "lib/window",
    "lib/js/wire",
    "Examples/Desktop/Rust/01-Terminal",
    "Examples/Desktop/Rust/02-Window",
    "Examples/Web/Rust/01-Linked",
    "Examples/Web/httpd",
]
# The DOS build is its own workspace: a different target, a nightly
# toolchain and build-std. `cd Examples/DOS/Rust && cargo +nightly build --release`.
exclude = ["Examples/DOS/Rust"]

# The browser module: small and honest. Profiles only count here, in the
# workspace root, so the wasm crate's wishes live here too. They apply to
# every release build, which is fine - nothing else minds.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
